---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate
spec:
  interval: 1m0s
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate
  ref:
    # renovate: datasource=github-releases depName=kagent-dev/substrate extractVersion=^v(?<version>.*)$
    # NOTE: chart tags are published WITHOUT the v prefix (0.0.9, not v0.0.9)
    tag: 0.0.9
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
spec:
  interval: 1m0s
  releaseName: substrate
  chartRef:
    kind: OCIRepository
    name: substrate
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    auth:
      jwt:
        # k3s mints SA tokens with the API-server endpoint as the OIDC issuer.
        # Confirmed via: kubectl get --raw /.well-known/openid-configuration | jq .issuer
        issuer: https://kubernetes.default.svc.cluster.local
  # Announce stable per-pod DNS names on the cluster bus instead of pod IPs.
  # Without this, a full cluster restart gives every pod a new IP while
  # nodes.conf still holds the old ones -> cluster_state:fail.
  # With hostname announcement, nodes re-resolve via headless-service DNS
  # and the cluster reforms automatically.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: valkey-cluster
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/command
                value:
                  - sh
                  - -c
                  - >-
                    exec valkey-server /etc/valkey/valkey.conf
                    --cluster-announce-hostname "$(hostname).valkey-cluster-service.ate-system.svc.cluster.local"
                    --cluster-preferred-endpoint-type hostname
          # rustfs uses an RWO PVC; RollingUpdate can deadlock on multi-attach
          # after restarts (new pod can't attach while old pod holds the volume).
          # Recreate kills the old pod first, avoiding the deadlock.
          # On k3s this PVC is backed by local-path provisioner.
          - target:
              kind: Deployment
              name: rustfs
            patch: |-
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
