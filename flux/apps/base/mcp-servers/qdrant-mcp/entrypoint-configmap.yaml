---
# OAuth-enabled entrypoint for mcp-server-qdrant. Mounted into the
# qdrant-mcp-server pod and exec'd instead of the stock `mcp-server-qdrant`
# CLI. Enables fastmcp's OAuth provider so MCP OAuth clients (Claude Desktop)
# can complete the authorization-code + PKCE flow, while a static Bearer token
# (QDRANT_MCP_STATIC_TOKEN secret) keeps headless consumers (Hermes researcher
# gateway) working without a browser.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qdrant-mcp-oauth-entrypoint
  labels:
    app: qdrant-mcp-server
data:
  entrypoint.py: |
    #!/usr/bin/env python3
    """
    OAuth-enabled entrypoint for the shared qdrant MCP server.

    Problem it fixes: Claude Desktop (and other MCP OAuth clients) cannot do the
    OAuth dance against a server whose whole route is fronted by Traefik basicAuth.
    The basicAuth 401 makes Claude Desktop *start* an OAuth flow, but the server had
    no OAuth endpoints, so auth failed.

    Fix: run mcp-server-qdrant with fastmcp's OAuth provider so the server itself
    serves /.well-known/oauth-authorization-server, /authorize, /token, /register,
    /revoke (mounted WITHOUT auth) and requires a Bearer token on /mcp.

    Auth model:
      - Interactive MCP clients (Claude Desktop): full OAuth authorization-code
        flow with PKCE + dynamic client registration against the server. Tokens
        are in-memory (lost on pod restart; client just re-auths).
      - Headless/scripted consumers (Hermes researcher gateway): a static Bearer
        token (QDRANT_MCP_STATIC_TOKEN env var, from a k8s secret) accepted by the
        same provider — no browser flow needed.

    InMemoryOAuthProvider auto-approves /authorize (no consent page): the client
    is redirected straight back with a code. Fine for a homelab.
    """
    import os

    from mcp.server.auth.middleware.bearer_auth import BearerAuthBackend
    from mcp.server.auth.provider import AccessToken, ProviderTokenVerifier

    # fastmcp 2.7.0 calls BearerAuthBackend(provider=...) but the mcp SDK's
    # BearerAuthBackend only accepts token_verifier=. Shim the constructor so
    # fastmcp's auth wiring works with the installed SDK.
    _orig_bearer_init = BearerAuthBackend.__init__


    def _patched_bearer_init(self, provider=None, token_verifier=None):
        if token_verifier is None:
            token_verifier = ProviderTokenVerifier(provider)
        _orig_bearer_init(self, token_verifier)


    BearerAuthBackend.__init__ = _patched_bearer_init

    from fastmcp.server.auth.providers.in_memory import InMemoryOAuthProvider
    from fastmcp.server.auth.auth import ClientRegistrationOptions
    from mcp_server_qdrant.mcp_server import QdrantMCPServer
    from mcp_server_qdrant.settings import (
        EmbeddingProviderSettings,
        QdrantSettings,
        ToolSettings,
    )

    ISSUER_URL = os.environ.get(
        "QDRANT_MCP_ISSUER_URL",
        "https://qdrant-mcp.192.168.1.237.nip.io",
    )
    STATIC_TOKEN = os.environ.get("QDRANT_MCP_STATIC_TOKEN", "")


    class QdrantOAuthProvider(InMemoryOAuthProvider):
        """InMemoryOAuthProvider that also accepts a long-lived static token.

        The static token lets the headless researcher gateway (which cannot open
        a browser) authenticate without the interactive OAuth flow. Everything
        else (dynamic client registration, PKCE code flow, refresh tokens) is
        inherited from the in-memory provider, so Claude Desktop works normally.
        """

        async def load_access_token(self, token: str) -> AccessToken | None:
            if STATIC_TOKEN and token == STATIC_TOKEN:
                return AccessToken(
                    token=token,
                    client_id="static",
                    scopes=[],
                    expires_at=None,  # never expires
                )
            return await super().load_access_token(token)


    def main() -> None:
        provider = QdrantOAuthProvider(
            issuer_url=ISSUER_URL,
            service_documentation_url=ISSUER_URL,
            client_registration_options=ClientRegistrationOptions(
                enabled=True,  # allow dynamic client registration (Claude Desktop)
            ),
            # No required scopes — mcp-server-qdrant tools don't declare any.
            required_scopes=None,
        )

        mcp = QdrantMCPServer(
            tool_settings=ToolSettings(),
            qdrant_settings=QdrantSettings(),
            embedding_provider_settings=EmbeddingProviderSettings(),
        )
        # fastmcp reads `.auth` when building the ASGI app (http_app()).
        mcp.auth = provider

        # FASTMCP_SERVER_HOST / FASTMCP_SERVER_PORT are set in the Deployment.
        mcp.run(
            transport="streamable-http",
            host=os.environ.get("FASTMCP_SERVER_HOST", "0.0.0.0"),
            port=int(os.environ.get("FASTMCP_SERVER_PORT", "8000")),
        )


    if __name__ == "__main__":
        main()
