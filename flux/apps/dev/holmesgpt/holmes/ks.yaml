---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app holmesgpt-holmes
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: holmesgpt-model-secret
    - name: kube-prometheus-stack
      namespace: monitoring
    - name: grafana
      namespace: monitoring
  interval: 1h
  path: ./flux/apps/base/holmesgpt/holmes
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: holmesgpt
  timeout: 10m
  prune: true
  wait: true
