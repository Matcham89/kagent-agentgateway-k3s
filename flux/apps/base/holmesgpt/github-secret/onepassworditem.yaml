---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: holmesgpt-github
spec:
  # Materialised as Secret "holmesgpt-github". Expected key: "token"
  # (the Helm chart's mcpAddons.github.auth.secretName default lookup key —
  # see ../holmes/helmrelease.yaml). If you label the 1Password field to
  # match the item name instead (as with the Anthropic/Slack items), tell me
  # and I'll fix the secretKey reference the same way — same pattern every
  # time so far.
  #
  # Prerequisite: create an item named "HOLMESGPT_GITHUB_PAT" in the same
  # 1Password vault used by the other secrets, holding a GitHub Personal
  # Access Token scoped to Matcham89/kagent-agentgateway-k3s (or org-wide)
  # with:
  #   Classic PAT: repo (full control), workflow
  #   Fine-grained PAT: Contents (R/W), Pull requests (R/W), Metadata (R/O)
  # https://holmesgpt.dev/latest/data-sources/builtin-toolsets/github-mcp/
  itemPath: "vaults/wlgvy5jij6zg2sb25nju4nyjnm/items/HOLMESGPT_GITHUB_PAT"
