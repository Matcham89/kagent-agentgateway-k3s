---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app holmesgpt-health-checks
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # Needs the Holmes Operator's CRDs + controller running to reconcile.
    - name: holmesgpt-holmes
  interval: 1h
  path: ./flux/apps/base/holmesgpt/health-checks
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: holmesgpt
  timeout: 5m
  prune: true
  wait: true
