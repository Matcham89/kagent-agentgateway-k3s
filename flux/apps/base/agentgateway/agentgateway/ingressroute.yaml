---
# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik/v3.5/pkg/provider/kubernetes/crd/traefik.io_ingressroutes.yaml
# External MCP endpoint. Agent Gateway terminates the MCP Authorization
# spec flow (validates Keycloak JWTs, proxies metadata) and forwards to the
# qdrant-mcp backend. Uses the same hostname as the old direct route so
# client configs only change auth (add token), not the URL. TLS cert from
# the qdrant-mcp-tls secret (homelab local CA, imperative).
#
# qdrant-mcp.kubegit.com (via the Cloudflare Tunnel - ../../cloudflare-tunnel)
# is the same MCP backend, reachable from Anthropic's cloud for the Claude
# custom connector - Anthropic can't route to the 192.168.1.0/24 LAN, so the
# nip.io hostname above only works for local/LAN clients (kagent, Hermes).
# Cloudflare terminates the public TLS edge and reaches this origin over
# plain HTTP, which is why this route is split in two below rather than
# one IngressRoute listing both entryPoints: in this Traefik install, an
# IngressRoute with a spec.tls block silently fails to match ANY request
# on its "web" entryPoint routers, even though "web" is listed alongside
# "websecure" in spec.entryPoints (reproduced directly against Traefik,
# bypassing Cloudflare entirely - not a Cloudflare or agentgateway issue).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qdrant-mcp-server
  labels:
    app: agentgateway-standalone
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`qdrant-mcp.192.168.1.237.nip.io`) || Host(`qdrant-mcp.kubegit.com`)
      services:
        - name: agentgateway-standalone
          namespace: agentgateway-system
          port: 80
  tls:
    secretName: qdrant-mcp-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qdrant-mcp-server-plain
  labels:
    app: agentgateway-standalone
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`qdrant-mcp.192.168.1.237.nip.io`) || Host(`qdrant-mcp.kubegit.com`)
      services:
        - name: agentgateway-standalone
          namespace: agentgateway-system
          port: 80
