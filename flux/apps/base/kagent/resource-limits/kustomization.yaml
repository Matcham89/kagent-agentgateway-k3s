apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kagent

# Patch deployments with increased memory limits to prevent OOM crashes
patches:
  - target:
      kind: Deployment
      name: kagent-kmcp-controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
