---
# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik/v3.5/pkg/provider/kubernetes/crd/traefik.io_ingressroutes.yaml
# Exposes the Keycloak admin console + OIDC endpoints on the LAN. No
# BasicAuth — Keycloak is the auth provider itself. TLS cert from the
# keycloak-tls secret (homelab local CA, created imperatively, not in git).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`keycloak.192.168.1.237.nip.io`)
      services:
        - name: keycloak
          port: 80
  tls:
    secretName: keycloak-tls
---
# Public route for Keycloak's own hostname (Keycloak now bakes
# keycloak.kubegit.com into every URL it generates — see
# ../../keycloak/keycloak/helmrelease.yaml — so Anthropic's cloud can
# reach the real OAuth endpoints Claude discovers, not just a proxy).
# /admin is included deliberately (own decision, not a default) - the
# admin console has no separate auth of its own, it's gated by the same
# Keycloak login as everything else here. No tls block/entrypoint here
# either: reached over plain HTTP via the Cloudflare Tunnel
# (../cloudflare-tunnel), and combining a tls block with a "web"
# entrypoint route in one IngressRoute breaks the latter in this Traefik
# install (see ../agentgateway/agentgateway/ingressroute.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-public
  labels:
    app: keycloak
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`keycloak.kubegit.com`) && (PathPrefix(`/realms/mcp`) || PathPrefix(`/resources`) || PathPrefix(`/admin`))
      middlewares:
        - name: force-forwarded-https
      services:
        - name: keycloak
          port: 80
---
# Cloudflare's origin request to this route is plain HTTP on port 80
# (public TLS already terminated at Cloudflare's edge), so Traefik
# correctly-but-unhelpfully reports X-Forwarded-Proto: http and
# X-Forwarded-Port: 80 to Keycloak - true for the Traefik hop, not for
# the original client connection - which then bakes http://...:80 into
# every URL it generates (issuer, authorization_endpoint, etc.): a
# scheme AND port mismatch against agentgateway's plain https:// issuer
# config (no port), and Claude won't accept a non-https authorization
# endpoint anyway. Safe to override both here specifically: this route
# is only ever reached via the Cloudflare Tunnel, which has already
# terminated real public TLS on 443 before Traefik sees anything.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: force-forwarded-https
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
      X-Forwarded-Port: "443"
