---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: keycloak
spec:
  interval: 30m
  url: oci://registry-1.docker.io/bitnamicharts/keycloak
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: 25.2.0
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: keycloak
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
    remediation:
      strategy: rollback
      retries: 3
  values:
    replicaCount: 1
    # annotations marker for hook re-runs
    auth:
      adminUser: admin
      # Admin password comes from the keycloak-admin secret (imperative,
      # not in git — same pattern as qdrant-mcp-tls). Created via:
      #   kubectl create secret generic keycloak-admin -n keycloak \
      #     --from-literal=admin-password=<strong-password>
      existingSecret: keycloak-admin
      existingSecretPasswordKey: admin-password

    proxy: edge
    production: false
    # Emit the external HTTPS URL in the OIDC issuer/discovery (Keycloak
    # defaults to http://<service> otherwise, breaking JWT issuer checks).
    hostname: keycloak.192.168.1.237.nip.io
    hostnameStrict: false
    proxyHeaders: xforwarded

    # Declarative realm bootstrap via keycloak-config-cli — the realm,
    # clients, and users are defined in Git (values below), not hand-clicked
    # in the admin console. Re-runs reconcile, so client secret changes in
    # the realm config are applied on each Helm upgrade.
    keycloakConfigCli:
      enabled: true
      image:
        registry: docker.io
        repository: bitnamilegacy/keycloak-config-cli
        tag: 6.4.0-debian-12-r11
      # Credentials are set imperatively via the Keycloak admin API, not
      # through config-cli env substitution (Bitnami's job doesn't pass
      # extraEnvVars through reliably). No secrets in git.
      configuration:
        realm.json: |
          {
            "realm": "mcp",
            "enabled": true,
            "sslRequired": "none",
            "registrationAllowed": false,
            "loginWithEmailAllowed": false,
            "users": [
              {
                "username": "matcham",
                "enabled": true,
                "email": "chris@homelab.local",
                "firstName": "Chris",
                "lastName": "Matcham",
                "realmRoles": ["default-roles-mcp", "mcp-user"]
              }
            ],
            "roles": {
              "realm": [
                { "name": "mcp-user", "description": "Can read and write MCP tools" },
                { "name": "mcp-admin", "description": "Full MCP access" }
              ]
            },
            "clients": [
              {
                "clientId": "agentgateway",
                "enabled": true,
                "protocol": "openid-connect",
                "publicClient": false,
                "serviceAccountsEnabled": true,
                "directAccessGrantsEnabled": true,
                "standardFlowEnabled": true,
                "redirectUris": ["https://qdrant-mcp.192.168.1.237.nip.io/*"],
                "webOrigins": ["+"],
                "protocolMappers": [
                  {
                    "name": "aud-agentgateway",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-audience-mapper",
                    "config": {
                      "included.client.audience": "agentgateway",
                      "access.token.claim": "true",
                      "id.token.claim": "true"
                    }
                  }
                ]
              },
              {
                "clientId": "claude-desktop",
                "enabled": true,
                "protocol": "openid-connect",
                "publicClient": true,
                "standardFlowEnabled": true,
                "directAccessGrantsEnabled": true,
                "redirectUris": ["http://127.0.0.1/*"],
                "webOrigins": ["+"],
                "protocolMappers": [
                  {
                    "name": "aud-agentgateway",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-audience-mapper",
                    "config": {
                      "included.client.audience": "agentgateway",
                      "access.token.claim": "true",
                      "id.token.claim": "true"
                    }
                  }
                ]
              }
            ]
          }

    postgresql:
      enabled: true
      # Bitnami images moved off docker.io to the bitnamilegacy namespace
      # (docker.io/bitnami/* tags were purged).
      image:
        registry: docker.io
        repository: bitnamilegacy/postgresql
        tag: 17.6.0-debian-12-r0
      auth:
        username: bn_keycloak
        database: bitnami_keycloak
        existingSecret: keycloak-postgres
      primary:
        persistence:
          enabled: true
          storageClass: local-path
          size: 8Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi

    # Bitnami images moved off docker.io to the bitnamilegacy namespace
    # (docker.io/bitnami/* tags were purged). Pin the legacy registry
    # explicitly.
    image:
      registry: docker.io
      repository: bitnamilegacy/keycloak
      tag: 26.3.3-debian-12-r0
