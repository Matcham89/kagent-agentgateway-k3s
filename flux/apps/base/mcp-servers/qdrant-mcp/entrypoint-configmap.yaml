---
# Slim entrypoint for mcp-server-qdrant: runs the stock server on
# 0.0.0.0 (the stock CLI binds 127.0.0.1 by default, which the Service
# can't reach). No auth here — Agent Gateway is the single auth boundary
# (Keycloak JWT) and the NetworkPolicy restricts this service to
# agentgateway-system, kagent, ate-system and traefik only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qdrant-mcp-entrypoint
  labels:
    app: qdrant-mcp-server
data:
  entrypoint.py: |
    #!/usr/bin/env python3
    """Run mcp-server-qdrant on 0.0.0.0 with streamable-http transport."""
    import os

    from mcp_server_qdrant.server import mcp

    mcp.run(
        transport="streamable-http",
        host=os.environ.get("FASTMCP_SERVER_HOST", "0.0.0.0"),
        port=int(os.environ.get("FASTMCP_SERVER_PORT", "8000")),
    )
