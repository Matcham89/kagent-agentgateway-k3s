---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kube-prometheus-stack
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # Alertmanager mounts the alertmanager-slack Secret as a file
    # (alertmanagerSpec.secrets) — must exist before/while the HelmRelease
    # reconciles so the pod isn't stuck waiting on a missing volume.
    - name: alertmanager-slack
  interval: 1h
  path: ./flux/apps/base/monitoring/kube-prometheus-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: monitoring
  timeout: 10m
  prune: true
  wait: true
