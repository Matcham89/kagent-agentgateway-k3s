---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway-standalone
spec:
  interval: 30m
  url: oci://cr.agentgateway.dev/charts/agentgateway-standalone
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # renovate: datasource=helm registryUrl=oci://cr.agentgateway.dev/charts
    semver: v1.4.1
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-standalone
spec:
  interval: 30m
  releaseName: agentgateway-standalone
  chartRef:
    kind: OCIRepository
    name: agentgateway-standalone
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
    remediation:
      strategy: rollback
      retries: 3
    force: true
  values:
    service:
      type: ClusterIP
