---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kagent-dev/kagent/main/config/crd/bases/kagent.dev_agentharnesses.yaml
# Autonomous research/scouting agent: browses the web for content ideas and
# writes findings into Qdrant via the qdrant-mcp RemoteMCPServer
# (../qdrant-mcp/remotemcpserver.yaml).
#
# backend: hermes, not openclaw — OpenClaw's ACP bridge explicitly rejects
# per-session `mcpServers` in `session/new`/`session/load` ("MCP must be
# configured on the gateway/agent side"), confirmed live and documented in
# kagent's own design/EP-XXXX-acp-integration.md. Hermes's ACP server runs
# in-process and does accept `mcpServers` there
# (https://hermes-agent.nousresearch.com/docs/user-guide/features/acp), so
# qdrant-mcp can be passed straight into session/new instead of needing to
# be baked into the actor's golden snapshot. Hermes's built-in toolset also
# includes browser_navigate/browser_click, a better native fit for
# "scout the web" than OpenClaw's shell-only sandbox tools.
#
# No chat channel (Slack/Telegram) is configured — interact with it via
# kagent's own chat UI/CLI (ACP session), not a messaging integration.
apiVersion: kagent.dev/v1alpha2
kind: AgentHarness
metadata:
  name: content-scout
spec:
  description: Researches and scouts content ideas, storing findings in Qdrant for a downstream drafting step
  backend: hermes
  modelConfigRef: default-model-config
  substrate:
    workerPoolRef:
      name: kagent-default
