---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway-standalone
spec:
  interval: 30m
  url: oci://cr.agentgateway.dev/charts/agentgateway-standalone
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # renovate: datasource=helm registryUrl=oci://cr.agentgateway.dev/charts
    semver: v1.4.1
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-standalone
spec:
  interval: 30m
  releaseName: agentgateway-standalone
  chartRef:
    kind: OCIRepository
    name: agentgateway-standalone
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
    remediation:
      strategy: rollback
      retries: 3
    force: true
  values:
    gateway:
      service:
        type: ClusterIP

    # ANTHROPIC_API_KEY is sourced from the OnePasswordItem-managed Secret
    # (see ../model-secret/anthropic.yaml) and referenced by config.llm.models
    # below via the "$ANTHROPIC_API_KEY" env-var interpolation syntax.
    # https://agentgateway.dev/docs/standalone/main/llm/providers/anthropic/
    #
    # QDRANT_MCP_STATIC_TOKEN is the qdrant backend's own Bearer token (same
    # value as secret qdrant-mcp-oauth-token in mcp-servers, duplicated into
    # agentgateway-system because env secretKeyRef can't cross namespaces).
    # AG attaches it to backend requests via policies.backendAuth.key below.
    extraEnv:
      - name: ANTHROPIC_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway-anthropic
            key: HOLMESGPT_ANTHROPIC_API_KEY
      - name: QDRANT_MCP_STATIC_TOKEN
        valueFrom:
          secretKeyRef:
            name: agentgateway-qdrant-token
            key: token

    # Setting config replaces the chart's default config.yaml entirely, so
    # gateways.default.port must stay 4000 to match gateway.service above
    # (it also serves the admin UI on the same port).
    config:
      gateways:
        default:
          port: 4000
      ui: {}
      mcp:
        # MCP authentication: validate JWTs issued by Keycloak (realm "mcp",
        # client "agentgateway"). Clients (Claude Desktop, Claude Code, the
        # Hermes researcher gateway) get tokens via OAuth/OIDC against
        # https://keycloak.192.168.1.237.nip.io/realms/mcp. AG acts as the
        # resource server per the MCP Authorization spec, proxying the
        # authorization-server metadata and validating tokens via JWKS.
        policies:
          mcpAuthentication:
            issuer: https://keycloak.192.168.1.237.nip.io/realms/mcp
            audiences:
              - agentgateway
            jwks:
              url: https://keycloak.192.168.1.237.nip.io/realms/mcp/protocol/openid-connect/certs
            provider:
              keycloak: {}
            resourceMetadata:
              resource: agentgateway
              scopesSupported:
                - read:all
              bearerMethodsSupported:
                - header
                - body
                - query
          # Attach the qdrant backend's static Bearer token to proxied
          # requests (the backend still enforces it server-side).
          backendAuth:
            key:
              value: "Bearer $QDRANT_MCP_STATIC_TOKEN"
        targets:
          - name: qdrant
            mcp:
              host: http://qdrant-mcp-server.mcp-servers.svc.cluster.local:8000/mcp
      llm:
        models:
          - name: "claude-sonnet-5"
            provider: anthropic
            params:
              apiKey: "$ANTHROPIC_API_KEY"
