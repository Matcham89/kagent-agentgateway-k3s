---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: alertmanager-slack
spec:
  # Materialised as Secret "alertmanager-slack" with key SLACK_WEBHOOK_URL.
  #
  # Prerequisite: create an item named "ALERTMANAGER_SLACK_WEBHOOK_URL" in
  # the same 1Password vault used by the other secrets in this cluster, with
  # a field labelled exactly "SLACK_WEBHOOK_URL" holding a Slack Incoming
  # Webhook URL (https://hooks.slack.com/services/...) posting to
  # #homelab-alerts.
  #
  # Mounted into the Alertmanager pod as a file (not an env var) via
  # alertmanager.alertmanagerSpec.secrets in
  # ../kube-prometheus-stack/helmrelease.yaml, and referenced from the
  # "slack-warnings" receiver via api_url_file — Alertmanager's config
  # format has no {{ env.VAR }} templating like Holmes/kagent, so file-mount
  # is the standard way to keep the webhook URL out of the rendered config
  # (and out of git).
  itemPath: "vaults/wlgvy5jij6zg2sb25nju4nyjnm/items/ALERTMANAGER_SLACK_WEBHOOK_URL"
