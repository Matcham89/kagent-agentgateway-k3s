---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: robusta
spec:
  interval: 10m
  url: https://robusta-charts.storage.googleapis.com
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: holmesgpt
spec:
  interval: 1m
  releaseName: holmesgpt
  chart:
    spec:
      chart: holmes
      # renovate: datasource=helm registryUrl=https://robusta-charts.storage.googleapis.com
      version: 0.38.2
      sourceRef:
        kind: HelmRepository
        name: robusta
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
    crds: Create
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    logLevel: INFO
    # `enableTelemetry` controls the chart's built-in Sentry SDK, which ships
    # unhandled-exception reports to Robusta's (third-party, off-cluster)
    # Sentry project. It has nothing to do with our own Grafana/Tempo stack —
    # that's wired up separately below via OTEL_EXPORTER_OTLP_ENDPOINT, which
    # is HolmesGPT's own OpenTelemetry instrumentation and stays fully
    # in-cluster. Keep Sentry disabled; keep OTel enabled.
    # https://holmesgpt.dev/latest/reference/opentelemetry/
    enableTelemetry: false

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1024Mi

    createServiceAccount: true

    # Export Holmes's own investigation traces/metrics to the cluster's Tempo,
    # the same way kagent does (see ../../kagent/operator/helmrelease.yaml).
    # Produces a `holmesgpt.investigation` trace per ask/health-check, with
    # child spans per LLM call and tool/MCP invocation, plus token/latency
    # metrics — queryable via the grafana/tempo toolset configured below.
    additionalEnvVars:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://tempo.monitoring.svc.cluster.local:4317"
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: "grpc"
      - name: OTEL_SERVICE_NAME
        value: "holmesgpt"
      # Default model (must match a modelList key below). The docs describe
      # a `values.config.model` field for this, but chart 0.38.2 has no
      # template wired to `.Values.config` at all (verified: `helm template`
      # + grep the chart — it's silently dropped). Holmes's own config.py
      # DOES read the plain `MODEL` env var as a fallback
      # (Config._apply_env_fallbacks), so that's the field that actually
      # works. Without this, holmes/config.py's backward-compat path kicks
      # in instead: any pod with OPENAI_API_KEY set (ours has one, for the
      # secondary model) silently gets an extra unwanted default model
      # "gpt-5.4" injected ahead of ours. Confirmed via live pod testing.
      - name: MODEL
        value: "claude-sonnet-4-5"
      # Global Slack token for HealthCheck/ScheduledHealthCheck `mode: alert`
      # destinations (type: slack) — must be set on the Holmes API server
      # (this chart's main values), not under `operator:` below.
      # See ../slack-secret/onepassworditem.yaml and
      # https://holmesgpt.dev/latest/operator/destinations/
      #
      # NOTE: env var name (SLACK_TOKEN) is fixed — Holmes reads it literally
      # by that name. The Secret *key* it's sourced from is
      # HOLMESGPT_SLACK_BOT_TOKEN, matching the 1Password item's field label
      # (confirmed live: `kubectl get secret holmesgpt-slack -o yaml`).
      - name: SLACK_TOKEN
        valueFrom:
          secretKeyRef:
            name: holmesgpt-slack
            key: HOLMESGPT_SLACK_BOT_TOKEN

    # API keys are mounted from the OnePasswordItem-managed Secrets
    # (see ../model-secret) and referenced by modelList via the envRef: sugar.
    extraEnvVarsSecrets:
      - holmesgpt-openai
      - holmesgpt-anthropic

    modelList:
      claude-sonnet-4-5:
        model: anthropic/claude-sonnet-4-5-20250929
        # Field label on the 1Password item is HOLMESGPT_ANTHROPIC_API_KEY
        # (see ../model-secret/anthropic.yaml), so that's the Secret key /
        # env var name mounted via extraEnvVarsSecrets — not ANTHROPIC_API_KEY.
        api_key: envRef:HOLMESGPT_ANTHROPIC_API_KEY
        temperature: 1
        thinking:
          budget_tokens: 10000
          type: enabled
      gpt-4.1:
        model: openai/gpt-4.1
        api_key: envRef:OPENAI_API_KEY
        temperature: 0

    toolsets:
      kubernetes/core:
        enabled: true
      kubernetes/logs:
        enabled: true
      # Not using the Robusta SaaS platform in this cluster.
      robusta:
        enabled: false
      internet:
        enabled: true
      prometheus/metrics:
        enabled: true
        subtype: prometheus
        config:
          # Prometheus Operator service created by kube-prometheus-stack.
          prometheus_url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
      grafana/loki:
        enabled: true
        config:
          # Direct connection to the in-cluster Loki (SingleBinary mode).
          api_url: http://loki.monitoring.svc.cluster.local:3100
      grafana/tempo:
        enabled: true
        config:
          # Direct connection to the in-cluster Tempo HTTP API (kagent's OTLP
          # traces land here too, so Holmes can correlate agent traces).
          api_url: http://tempo.monitoring.svc.cluster.local:3200

    # Holmes Operator (alpha): HealthCheck / ScheduledHealthCheck CRDs +
    # kopf-based controller, bundled in the same chart as the API server.
    # https://holmesgpt.dev/latest/operator/
    operator:
      enabled: true
      # Must exceed the longest HealthCheck.spec.timeout in use (max
      # allowed there is 300s) with real headroom. Confirmed live: with
      # this at 300 and a GitHub-PR-creating TriggeredHealthCheck at
      # timeout:180, the actual investigation legitimately took ~334s
      # (extra real network round-trips to the GitHub API on top of the
      # normal LLM tool loop) — the operator's HTTP client gave up and
      # retried at almost exactly the 300s mark, seconds before Holmes
      # would have returned, leaving the HealthCheck stuck in `Running`
      # forever even though the check itself completed successfully
      # (PR created, Slack notified).
      holmesApiTimeout: 450
      maxHistoryItems: 10
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    # Lets Holmes ACT on the cluster (restart/scale/patch/exec/run diagnostic
    # pods), not just read it — needed for "investigate AND fix" workflows
    # like ../demo/nginx-test/triggeredhealthcheck.yaml.
    # Plug-and-play: chart creates its own scoped ClusterRole (no
    # cluster-admin, no secrets access), a locked-down NetworkPolicy, and
    # wires approval_required_tools: ["run_kubectl_command"] automatically.
    #
    # IMPORTANT blast-radius note: the ClusterRole this grants is
    # cluster-scoped by resource type (deployments/statefulsets/daemonsets/
    # replicasets/pods/jobs/cronjobs/nodes — patch/update/delete/exec/evict),
    # not limited to the demo namespace — the chart has no per-namespace
    # scoping knob. Read-only + diagnostic tools run automatically anywhere
    # in the cluster; only the mutating fallback (run_kubectl_command) is
    # gated behind human approval, everywhere.
    # https://holmesgpt.dev/latest/data-sources/builtin-toolsets/kubernetes-remediation-mcp/
    #
    mcpAddons:
      kubernetesRemediation:
        enabled: true
      # `github` is NOT enabled here as a chart addon anymore — that would
      # deploy its MCP server tied to this Helm release/namespace. It now
      # lives as a generic, shareable server in the mcp-servers namespace
      # (see mcp_servers.github below and
      # flux/apps/base/mcp-servers/github-mcp/deployment.yaml) so it isn't
      # Holmes-exclusive — kagent or anything else could connect too.

    # Custom MCP servers (not HolmesGPT chart addons) — both self-hosted in
    # the shared `mcp-servers` namespace, not `holmesgpt`, specifically so
    # they aren't tied to this Helm release and other tools in the cluster
    # (e.g. kagent) could connect to the same servers later. See
    # flux/apps/base/mcp-servers/.
    #
    # slack: no built-in HolmesGPT toolset posts threaded Slack
    # conversations (the HealthCheck `mode: alert` destination is one-shot,
    # single message) — this gives Holmes its own conversations_add_message
    # tool (with thread_ts support) so a query can explicitly drive: post
    # alert -> reply in thread with findings -> reply in thread with a PR
    # link. Reuses the same bot token as the built-in alert destination
    # (SLACK_TOKEN above / holmesgpt-slack secret) via a separate copy of
    # the same 1Password item, materialised in the mcp-servers namespace.
    #
    # github: creating branches/commits/PRs is NOT behind the same
    # human-approval gate as run_kubectl_command (a PR is a proposal, not a
    # live mutation — the PR review/merge itself is the approval step).
    # https://holmesgpt.dev/latest/data-sources/builtin-toolsets/github-mcp/
    mcp_servers:
      slack:
        description: "Post and reply-in-thread to Slack channels directly (separate from the one-shot HealthCheck alert destination)"
        config:
          url: "http://slack-mcp-server.mcp-servers.svc.cluster.local:8000/sse"
          mode: sse
        llm_instructions: >-
          Use conversations_add_message to post investigation updates to
          Slack. Reference a channel by name with a leading # (e.g.
          "#home-cluster"). To reply in a thread, pass the thread_ts value
          returned by the message you're replying to as the thread_ts
          parameter — omit thread_ts only for the first message in a new
          conversation.
      github:
        description: "GitHub repositories, pull requests, issues, and Actions"
        config:
          url: "http://github-mcp-server.mcp-servers.svc.cluster.local:8000/sse"
          mode: sse
        llm_instructions: >-
          Use this to open pull requests fixing GitOps-managed resources
          (create_branch, push_files/create_or_update_file,
          create_pull_request) instead of attempting a live kubectl
          mutation — this cluster is GitOps-managed by Flux, so the
          correct fix lives in git, not a live patch.
