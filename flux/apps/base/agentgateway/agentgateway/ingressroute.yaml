---
# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik/v3.5/pkg/provider/kubernetes/crd/traefik.io_ingressroutes.yaml
# External MCP endpoint. Agent Gateway terminates the MCP Authorization
# spec flow (validates Keycloak JWTs, proxies metadata) and forwards to the
# qdrant-mcp backend. Uses the same hostname as the old direct route so
# client configs only change auth (add token), not the URL. TLS cert from
# the qdrant-mcp-tls secret (homelab local CA, imperative).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qdrant-mcp-server
  labels:
    app: agentgateway-standalone
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Claude Desktop's "manual OAuth Client ID" connector flow doesn't do
    # RFC9728/RFC8414 discovery — it assumes the MCP server's own host
    # implements OAuth directly at conventional /authorize and /token
    # paths, ignoring the authorization_servers value in our protected
    # resource metadata. These two routes make that true: they forward
    # straight to Keycloak (bypassing agentgateway, which has no route for
    # these paths and previously misrouted them into its LLM proxy) with a
    # path rewrite to Keycloak's real realm endpoints. More specific than
    # the catch-all rule below, so Traefik prefers them for these paths.
    - kind: Rule
      match: Host(`qdrant-mcp.192.168.1.237.nip.io`) && PathPrefix(`/authorize`)
      middlewares:
        - name: qdrant-mcp-oauth-authorize-rewrite
      services:
        - name: keycloak
          namespace: keycloak
          port: 80
    - kind: Rule
      match: Host(`qdrant-mcp.192.168.1.237.nip.io`) && PathPrefix(`/token`)
      middlewares:
        - name: qdrant-mcp-oauth-token-rewrite
      services:
        - name: keycloak
          namespace: keycloak
          port: 80
    - kind: Rule
      match: Host(`qdrant-mcp.192.168.1.237.nip.io`)
      services:
        - name: agentgateway-standalone
          namespace: agentgateway-system
          port: 80
  tls:
    secretName: qdrant-mcp-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: qdrant-mcp-oauth-authorize-rewrite
spec:
  replacePathRegex:
    # Traefik matches this against the URL path only — the query string
    # (response_type, client_id, redirect_uri, code_challenge, etc.) isn't
    # part of it and is preserved automatically on the rewritten request.
    regex: ^/authorize$
    replacement: /realms/mcp/protocol/openid-connect/auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: qdrant-mcp-oauth-token-rewrite
spec:
  replacePathRegex:
    regex: ^/token$
    replacement: /realms/mcp/protocol/openid-connect/token
