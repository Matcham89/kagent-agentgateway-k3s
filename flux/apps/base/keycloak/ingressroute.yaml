---
# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik/v3.5/pkg/provider/kubernetes/crd/traefik.io_ingressroutes.yaml
# Exposes the Keycloak admin console + OIDC endpoints on the LAN. No
# BasicAuth — Keycloak is the auth provider itself. TLS cert from the
# keycloak-tls secret (homelab local CA, created imperatively, not in git).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`keycloak.192.168.1.237.nip.io`)
      services:
        - name: keycloak
          port: 80
  tls:
    secretName: keycloak-tls
---
# Public route for Keycloak's own hostname (Keycloak now bakes
# keycloak.kubegit.com into every URL it generates — see
# ../../keycloak/keycloak/helmrelease.yaml — so Anthropic's cloud can
# reach the real OAuth endpoints Claude discovers, not just a proxy).
# Deliberately narrow: only the MCP realm's auth-flow paths and its theme
# assets are routed, so the admin console and other realms stay
# unreachable from the internet regardless of what Cloudflare forwards -
# no route here means Traefik 404s before ever reaching Keycloak. No tls
# block/entryPoint here either: reached over plain HTTP via the Cloudflare
# Tunnel (../cloudflare-tunnel), and combining a tls block with a "web"
# entrypoint route in one IngressRoute breaks the latter in this Traefik
# install (see ../agentgateway/agentgateway/ingressroute.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-public
  labels:
    app: keycloak
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`keycloak.kubegit.com`) && (PathPrefix(`/realms/mcp`) || PathPrefix(`/resources`))
      middlewares:
        - name: force-forwarded-https
      services:
        - name: keycloak
          port: 80
---
# Cloudflare's origin request to this route is plain HTTP (public TLS
# already terminated at Cloudflare's edge), so Traefik correctly-but-
# unhelpfully reports X-Forwarded-Proto: http to Keycloak, which then
# bakes http:// into every URL it generates (issuer, authorization_
# endpoint, etc.) - a string mismatch against agentgateway's https://
# issuer config, and Claude won't accept a non-https authorization
# endpoint anyway. Safe to force here specifically: this route is only
# ever reached via the Cloudflare Tunnel, which has already terminated
# real public TLS before Traefik ever sees the request.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: force-forwarded-https
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
# Claude Desktop's "manual OAuth Client ID" connector flow doesn't do
# RFC9728/RFC8414 discovery — it assumes the MCP server's own host
# implements OAuth directly at conventional /authorize and /token paths,
# ignoring the authorization_servers value in qdrant-mcp's protected
# resource metadata (../agentgateway/agentgateway/helmrelease.yaml). These
# routes make that true for the qdrant-mcp hostname: forward straight to
# Keycloak with a path rewrite to its real realm endpoints. Lives here
# (not in the agentgateway IngressRoute) because Traefik's kubernetescrd
# provider forbids cross-namespace service/middleware references, and
# this needs to reach the keycloak Service directly.
#
# No explicit tls.secretName: the qdrant-mcp-tls cert is already
# registered with Traefik's SNI store via the agentgateway IngressRoute
# (../agentgateway/agentgateway/ingressroute.yaml) for this same hostname
# — TLS termination happens by SNI before HTTP routing, independent of
# which IngressRoute/namespace the matching router lives in. The
# qdrant-mcp.kubegit.com Host has no cert here at all - it's only reached
# over plain HTTP via the Cloudflare Tunnel (../cloudflare-tunnel), which
# terminates public TLS at Cloudflare's edge.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qdrant-mcp-oauth-proxy
  labels:
    app: keycloak
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: (Host(`qdrant-mcp.192.168.1.237.nip.io`) || Host(`qdrant-mcp.kubegit.com`)) && PathPrefix(`/authorize`)
      middlewares:
        - name: qdrant-mcp-oauth-authorize-rewrite
      services:
        - name: keycloak
          port: 80
    - kind: Rule
      match: (Host(`qdrant-mcp.192.168.1.237.nip.io`) || Host(`qdrant-mcp.kubegit.com`)) && PathPrefix(`/token`)
      middlewares:
        - name: qdrant-mcp-oauth-token-rewrite
      services:
        - name: keycloak
          port: 80
    # Keycloak's proxyHeaders: xforwarded config makes it trust the
    # incoming X-Forwarded-Host (which Traefik sets to whatever hostname
    # the browser actually used) over its own configured `hostname` when
    # building in-page links — so the interactive login form it renders
    # for /authorize posts back to login-actions/authenticate on this same
    # qdrant-mcp host, not keycloak's own. Proxy the whole realm path
    # through unmodified (these are already real Keycloak paths, no
    # rewrite needed) so the rest of the browser-driven login flow
    # (OTP/required actions/etc.) keeps working regardless of which
    # sub-path Keycloak generates next.
    - kind: Rule
      match: (Host(`qdrant-mcp.192.168.1.237.nip.io`) || Host(`qdrant-mcp.kubegit.com`)) && PathPrefix(`/realms/mcp`)
      services:
        - name: keycloak
          port: 80
    # Keycloak's login theme (CSS/JS/images) is served from this top-level
    # path, outside any realm prefix. Without it, the login page's own JS
    # (including its cookie/session-check script) 400s, which surfaces as
    # confusing cookie_not_found / user_not_found login errors even with
    # correct credentials, rather than a clean asset-404.
    - kind: Rule
      match: (Host(`qdrant-mcp.192.168.1.237.nip.io`) || Host(`qdrant-mcp.kubegit.com`)) && PathPrefix(`/resources`)
      services:
        - name: keycloak
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: qdrant-mcp-oauth-authorize-rewrite
spec:
  replacePathRegex:
    # Traefik matches this against the URL path only — the query string
    # (response_type, client_id, redirect_uri, code_challenge, etc.) isn't
    # part of it and is preserved automatically on the rewritten request.
    regex: ^/authorize$
    replacement: /realms/mcp/protocol/openid-connect/auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: qdrant-mcp-oauth-token-rewrite
spec:
  replacePathRegex:
    regex: ^/token$
    replacement: /realms/mcp/protocol/openid-connect/token
