---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: holmesgpt-slack
spec:
  # Materialised as Secret "holmesgpt-slack" with key
  # HOLMESGPT_SLACK_BOT_TOKEN (field label matches the item name — confirmed
  # live via `kubectl get secret holmesgpt-slack -o yaml`; the item also
  # carries a bonus "bot_app_key" field holding the xapp-... Socket Mode
  # token, unused by anything in this repo).
  #
  # Holds a Slack Bot Token (xoxb-...) with the chat:write scope. Invite the
  # bot to #home-cluster (/invite @<bot-name>) or it will fail to post with
  # a "not_in_channel" error.
  #
  # Referenced from ../holmes/helmrelease.yaml additionalEnvVars via
  # secretKeyRef (name: holmesgpt-slack, key: HOLMESGPT_SLACK_BOT_TOKEN),
  # exposed to the pod as env var SLACK_TOKEN (the name Holmes itself reads).
  itemPath: "vaults/wlgvy5jij6zg2sb25nju4nyjnm/items/HOLMESGPT_SLACK_BOT_TOKEN"
