---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Synthetic "real-world failure" workload: fails every run, on purpose.
# Exercises the full observability pipeline end-to-end:
#   CronJob fails daily
#     -> kube-state-metrics exposes kube_job_failed=1
#     -> Prometheus's built-in KubeJobFailed rule fires after 15m
#        (kube-prometheus-stack default rule, no custom PrometheusRule needed —
#        see flux/apps/base/monitoring/kube-prometheus-stack/helmrelease.yaml)
#     -> Alertmanager routes severity=warning to the "slack-warnings" receiver
#     -> HolmesGPT's daily ScheduledHealthCheck (runs 1h later) also picks up
#        the failed Job when it does its own investigation and posts to Slack
#
# backoffLimit: 0 means a single failed Pod immediately fails the Job (no
# retries), so kube_job_failed flips to 1 right away instead of after several
# CrashLoopBackOff cycles.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-failing-job
spec:
  # 08:00 UTC — 1h before holmesgpt's cluster-health-daily ScheduledHealthCheck
  # (0 9 * * *, see ../../holmesgpt/health-checks/scheduledhealthcheck.yaml)
  # so Holmes's own investigation runs after the failure and after
  # Alertmanager has already fired (KubeJobFailed's `for: 15m` easily clears
  # by 09:00).
  schedule: "0 8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # Keep failed Jobs around for a few days so there's something for Holmes /
  # a human to inspect after an alert fires, without accumulating forever.
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/name: daily-failing-job
        spec:
          restartPolicy: Never
          containers:
            - name: fail
              image: busybox:1.36
              command:
                - sh
                - -c
                - >-
                  echo "Simulating a real-world failure at $(date -u +%FT%TZ)";
                  exit 1
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                seccompProfile:
                  type: RuntimeDefault
