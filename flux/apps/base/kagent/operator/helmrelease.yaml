---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent
spec:
  interval: 1m0s
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent
  ref:
    # renovate: datasource=github-releases depName=kagent-dev/kagent
    tag: 0.10.0-rc3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
spec:
  interval: 1m0s
  releaseName: kagent
  chartRef:
    kind: OCIRepository
    name: kagent
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
  values:
    substrateWorkerPool:
      create: true
      replicas: 6
      # ateom-gvisor tag must match the substrate chart version, not the kagent version.
      ateomImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.0.9

    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
    podSecurityContext:
      fsGroup: 1000

    controller:
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 128Mi
      substrate:
        enabled: true
        ateApiEndpoint: "dns:///api.ate-system.svc:443"
        ateApiInsecure: true
        # Routes AgentHarness (network.allowedDomains) egress through the
        # substrate-operator's atenet-router — new in kagent 0.10.
        atenetRouterURL: "http://atenet-router.ate-system.svc:80"

    # Only the Kubernetes agent is enabled for this cluster. Each bundled
    # agent is its own top-level chart key defaulting to enabled: true
    # (there is no umbrella "agents:" key), so every other one has to be
    # disabled explicitly.
    kmcp:
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 10m
          memory: 256Mi

    k8s-agent:
      enabled: true
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi
    kgateway-agent:
      enabled: false
    istio-agent:
      enabled: false
    promql-agent:
      enabled: false
    observability-agent:
      enabled: false
    argo-rollouts-agent:
      enabled: false
    helm-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false

    otel:
      tracing:
        enabled: true
        exporter:
          otlp:
            # Tempo OTLP gRPC endpoint in the monitoring namespace
            endpoint: http://tempo.monitoring.svc.cluster.local:4317
            timeout: 15000 # milliseconds
            insecure: true
      logging:
        enabled: true
        exporter:
          otlp:
            endpoint: http://tempo.monitoring.svc.cluster.local:4317
            timeout: 15000 # milliseconds
            insecure: true
