---
# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik/v3.5/pkg/provider/kubernetes/crd/traefik.io_middlewares.yaml
# BasicAuth for the external qdrant-mcp endpoint. Credentials live in the
# qdrant-mcp-basicauth secret (created imperatively, not in git — same as the
# TLS secret). Protects the whole LAN-exposed surface: Claude Desktop, Claude
# Code, and the Hermes researcher gateway all authenticate.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: qdrant-mcp-basicauth
  labels:
    app: qdrant-mcp-server
spec:
  basicAuth:
    secret: qdrant-mcp-basicauth
