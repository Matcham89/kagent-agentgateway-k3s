---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
components:
  # Privileged PSS required for Prometheus node-exporter (hostPID, hostPath mounts)
  # and Promtail (host log path access)
  - ../../../infra/namespace-privileged

resources:
  - ./alertmanager-slack/ks.yaml
  - ./kube-prometheus-stack/ks.yaml
  - ./grafana/ks.yaml
