---
# yaml-language-server: $schema=https://raw.githubusercontent.com/HolmesGPT/holmesgpt/master/config/crd/bases/holmesgpt.dev_triggeredhealthchecks.yaml
# Watches nginx-test (./deployment.yaml) for pod template changes — i.e. any
# `kubectl edit`/`kubectl patch`/`kubectl set` that touches the Deployment's
# pod spec, including a manual containerPort edit intended to break it.
# https://holmesgpt.dev/latest/operator/triggered-health-checks/
#
# IMPORTANT #1: this resource MUST live in the same namespace as the
# Deployment it watches ("the operator watches Deployments in namespaces
# where TriggeredHealthCheck resources exist" — confirmed live: an earlier
# attempt with this resource in the holmesgpt namespace watching a
# Deployment in demo never fired, moving it here to the demo namespace
# fixed it).
#
# IMPORTANT #2: the selector below matches on `app`, NOT
# `app.kubernetes.io/name` — every ks.yaml in this repo injects
# `app.kubernetes.io/name: <kustomization-name>` onto every resource's own
# top-level metadata via commonMetadata, which silently overwrites this
# Deployment's `app.kubernetes.io/name` label to "demo-nginx-test" (it does
# NOT touch spec.template.metadata.labels, so the Service is unaffected —
# only the operator's rollout-matching, which reads the Deployment's own
# label, breaks). See deployment.yaml for the full explanation. Confirmed
# live: matching on app.kubernetes.io/name silently never fired (no error,
# no log — just never matched); switching to `app` fixed it immediately.
#
# Manual test flow:
#   kubectl edit deployment nginx-test -n demo
#   # change spec.template.spec.containers[0].ports[0].containerPort
#   # e.g. 80 -> 8080 (leave `name: http` alone - see deployment.yaml comment
#   # for why this specific edit causes a *silent* readiness failure)
#   # -> new ReplicaSet rolls out -> operator notices the pod-template change
#   # -> waits delaySeconds -> runs this check -> posts to Slack
#
# Alpha: TriggeredHealthCheck only supports the deploymentRollout trigger
# type today.
apiVersion: holmesgpt.dev/v1alpha1
kind: TriggeredHealthCheck
metadata:
  name: nginx-test-rollout-check
  labels:
    app.kubernetes.io/part-of: holmesgpt
    team: platform
spec:
  deploymentRollout:
    selector:
      matchLabels:
        app: nginx-test
  # Short wait since this is an interactive manual test, not a real app
  # with a slow rollout — long enough for the probe's failureThreshold
  # (2 x 5s) to actually trip before Holmes looks.
  delaySeconds: 30
  # Don't re-fire on every edit if you're iterating quickly.
  cooldownSeconds: 120
  # Full workflow this drives, as a single THREADED Slack conversation
  # (not the one-shot HealthCheck `mode: alert` destination — that only
  # sends one message, so `mode` is `monitor` here and Slack posting is
  # driven entirely by the query using the custom slack MCP server, see
  # ../../holmesgpt/slack-mcp/deployment.yaml and the mcp_servers.slack
  # block in ../../holmesgpt/holmes/helmrelease.yaml):
  #   break (kubectl edit/patch) -> rollout detected -> Holmes posts an
  #   initial alert -> investigates -> replies in the SAME thread with
  #   findings -> fixes the SOURCE FILE in git via the GitHub MCP (not a
  #   live kubectl mutation, which is approval-gated and always rejected in
  #   this headless context — see holmes/helmrelease.yaml comment) -> opens
  #   a PR -> replies in the SAME thread again with the PR link. Reviewing/
  #   merging the PR *is* the human-approval step; once merged, Flux
  #   applies it automatically (targetNamespace: demo, path
  #   flux/apps/base/demo/nginx-test).
  query: |
    This is nginx-test in the demo namespace, a standalone sandbox target
    with no real traffic — used purely for manual break/fix testing. A
    Deployment rollout was just detected. Run this as a THREADED Slack
    conversation in #home-cluster using the slack MCP's
    conversations_add_message tool — do not skip any of the Slack posts,
    and use the SAME thread_ts (from your first post) for every reply.

    Step 1 - Post an initial message to #home-cluster (no thread_ts, this
    starts the thread): something like "🔍 Detected a rollout of
    demo/nginx-test - investigating whether it's healthy." Remember the
    ts this call returns - it's the thread_ts for every later reply.

    Step 2 - Investigate: check whether it is actually healthy and serving
    traffic, not just whether the pod is Running: check pod readiness/probe
    status, compare the declared containerPort/port name against what the
    container actually listens on, and check whether the Service has a
    healthy endpoint.

    Step 3 - Reply in the SAME thread (thread_ts from step 1) with your
    findings: healthy or not, and if not, the root cause and evidence.

    Step 4 - If unhealthy, fix it via a GitHub pull request (do NOT attempt
    a live kubectl mutation - this cluster is GitOps-managed by Flux and
    manual kubectl changes get reverted; the correct fix lives in git):
      - Repo: Matcham89/kagent-agentgateway-k3s, base branch: main
      - File: flux/apps/base/demo/nginx-test/deployment.yaml
      - Create a new branch named holmes-fix-nginx-test-<short timestamp>
      - Change ONLY the broken field (e.g. containerPort) back to match
        the container's actual listening port - do not touch anything else
        in the file
      - Commit message: brief description of the root cause
      - Open a PR against main titled "Fix nginx-test containerPort
        mismatch" with a description containing: the root cause, the
        evidence for it, and the exact diff
      - Do not merge the PR yourself - a human must review and merge it

    Step 5 - Reply in the SAME thread (thread_ts from step 1) one more
    time with the PR URL, framed as a request for approval (e.g. "Fix
    ready for review: <PR URL> - please merge to apply.").

    If it turns out to be healthy (no rollout problem), just reply in the
    thread saying so and stop - skip steps 4 and 5.
  # Max allowed value (300s / 5 minutes) — GitHub operations (branch,
  # commit, PR) add real network round-trips on top of the normal LLM tool
  # loop, plus now 2-3 extra Slack MCP calls. Confirmed live in an earlier
  # (non-threaded) version of this query that a run legitimately took
  # ~334s, exceeding the previous 180s and racing the operator's own
  # holmesApiTimeout (see holmes/helmrelease.yaml comment) — this and that
  # were both bumped together.
  timeout: 300
  # monitor, not alert: Slack posting is done entirely by the query via the
  # slack MCP tools above, not the built-in one-shot alert destination
  # (using both would double-post).
  mode: monitor
