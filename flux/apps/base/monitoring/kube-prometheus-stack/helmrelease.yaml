---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
    crds: Create
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
    crds: CreateReplace
  values:
    alertmanager:
      enabled: true
      alertmanagerSpec:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
        # Mounts the OnePasswordItem-managed Secret at
        # /etc/alertmanager/secrets/alertmanager-slack/ALERTMANAGER_SLACK_WEBHOOK_URL —
        # see ../alertmanager-slack/onepassworditem.yaml. Alertmanager's
        # config has no {{ env.VAR }} templating, so the webhook URL is
        # referenced from config.receivers below via api_url_file instead
        # of being inlined in this (git-committed) values block.
        secrets:
          - alertmanager-slack
      # Full Alertmanager config (chart default is a "null"-only receiver —
      # see kube-prometheus-stack-alertmanager.rules / the auto-generated
      # secret prior to this change). Route only warning/critical severity
      # to Slack; keep the synthetic Watchdog heartbeat and info-level alerts
      # silenced, same as the chart's own defaults.
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal:
              - namespace
          - target_matchers:
              - alertname = InfoInhibitor
        route:
          receiver: "null"
          group_by: [namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - matchers:
                - alertname = "Watchdog"
              receiver: "null"
            - matchers:
                - severity =~ "warning|critical"
              receiver: slack-warnings
              continue: false
        receivers:
          - name: "null"
          - name: slack-warnings
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/ALERTMANAGER_SLACK_WEBHOOK_URL
                channel: "#home-cluster"
                send_resolved: true
        templates:
          - /etc/alertmanager/config/*.tmpl

    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
      prometheus:
        monitor:
          enabled: true
          interval: 30s
          scrapeTimeout: 30s

    nodeExporter:
      enabled: true
      operatingSystems:
        linux:
          enabled: true
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi

    prometheus:
      enabled: true
      prometheusSpec:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        # Pick up all ServiceMonitors, PodMonitors and PrometheusRules cluster-wide
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        enableFeatures:
          - native-histograms
        # Required for Tempo metrics generator to remote-write span metrics back
        enableRemoteWriteReceiver: true
        # Single-node k3s: use local-path storage
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi
        retention: 7d

    grafana:
      enabled: true
      grafana.ini:
        server:
          root_url: "http://localhost:3000/"
        # Anonymous access disabled — use admin credentials from secret
        auth.anonymous:
          enabled: false
      # Admin credentials — override via ExternalSecret or Helm values substitution
      # TODO: wire up admin secret via 1Password ExternalSecret
      adminUser: admin
      adminPassword: "" # populated from secret; see secrets/grafana-admin-secret.yaml
      persistence:
        enabled: false
      service:
        type: ClusterIP
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      # Auto-discover dashboards from ConfigMaps labelled grafana_dashboard: "1"
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: monitoring
        datasources:
          enabled: true
      # Pre-configure Prometheus, Loki and Tempo datasources
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
          isDefault: false
        - name: Tempo
          type: tempo
          url: http://tempo:3200
          access: proxy
          isDefault: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
            lokiSearch:
              datasourceUid: loki
