---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway-standalone
spec:
  interval: 30m
  url: oci://cr.agentgateway.dev/charts/agentgateway-standalone
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # renovate: datasource=helm registryUrl=oci://cr.agentgateway.dev/charts
    semver: v1.4.1
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-standalone
spec:
  interval: 30m
  releaseName: agentgateway-standalone
  chartRef:
    kind: OCIRepository
    name: agentgateway-standalone
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
    remediation:
      strategy: rollback
      retries: 3
    force: true
  values:
    gateway:
      service:
        type: ClusterIP

    # ANTHROPIC_API_KEY is sourced from the OnePasswordItem-managed Secret
    # (see ../model-secret/anthropic.yaml) and referenced by config.llm.models
    # below via the "$ANTHROPIC_API_KEY" env-var interpolation syntax.
    # https://agentgateway.dev/docs/standalone/main/llm/providers/anthropic/
    #
    # SSL_CERT_FILE trusts the homelab CA (Keycloak's cert is self-signed via
    # the local CA) so AG's JWKS fetch and OIDC discovery succeed. The bundle
    # = system CAs + homelab CA so public APIs (Anthropic) still verify.
    # rustls/reqwest honor SSL_CERT_FILE.
    extraEnv:
      - name: ANTHROPIC_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway-anthropic
            key: HOLMESGPT_ANTHROPIC_API_KEY
      - name: OPENROUTER_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway-openrouter
            key: OPENROUTER_API_KEY
      - name: SSL_CERT_FILE
        value: /certs/ca-bundle.crt

    extraVolumeMounts:
      - name: homelab-ca
        mountPath: /certs
        readOnly: true

    extraVolumes:
      - name: homelab-ca
        secret:
          secretName: homelab-ca-bundle

    # Setting config replaces the chart's default config.yaml entirely, so
    # gateways.default.port must stay 4000 to match gateway.service above
    # (it also serves the admin UI on the same port).
    config:
      gateways:
        default:
          port: 4000
      ui: {}
      mcp:
        # MCP authentication: validate JWTs issued by Keycloak (realm "mcp",
        # client "agentgateway"). Clients (Claude Desktop, Claude Code, the
        # Hermes researcher gateway) get tokens via OAuth/OIDC against
        # https://keycloak.kubegit.com/realms/mcp. AG acts as the resource
        # server per the MCP Authorization spec, proxying the
        # authorization-server metadata and validating tokens via JWKS.
        policies:
          # (AG's keycloak provider adapts the JWKS URL automatically).
          mcpAuthentication:
            mode: strict
            # Must exactly string-match the "iss" claim Keycloak puts in
            # every token, which is derived from its own hostname config
            # (../../keycloak/keycloak/helmrelease.yaml) - now the public
            # kubegit.com one, not the LAN-only nip.io one. Any token
            # minted before that change (e.g. the static
            # qdrant-mcp-oauth-token kagent/Hermes use) has the old issuer
            # baked in and needs re-minting.
            issuer: https://keycloak.kubegit.com/realms/mcp
            audiences:
              - agentgateway
            jwks:
              # Deliberately still the LAN address, not kubegit.com: this
              # is AG fetching signing keys itself (in-cluster), not a
              # claim to string-match, so there's no reason to route it
              # out through the tunnel and back when the fast LAN path
              # already works and returns the identical key set.
              url: https://keycloak.192.168.1.237.nip.io/realms/mcp/protocol/openid-connect/certs
            provider:
              keycloak: {}
            resourceMetadata:
              # Per Anthropic's connector docs, this must match the MCP
              # server URL exactly as entered in Claude (including path),
              # not an internal label — otherwise Claude can't validate the
              # metadata and silently falls back to guessing /authorize and
              # /token at the connector's origin. qdrant-mcp.kubegit.com
              # (via the Cloudflare Tunnel) is what's actually entered in
              # Claude's custom connector, since Anthropic's cloud can't
              # reach the LAN-only nip.io hostname.
              resource: https://qdrant-mcp.kubegit.com/mcp/http
              # Keycloak's real issuer, now that it's genuinely publicly
              # reachable (see ../../keycloak/keycloak/helmrelease.yaml and
              # ../../keycloak/ingressroute.yaml) rather than the LAN-only
              # nip.io host discovery would have resolved to before.
              authorizationServers:
                - https://keycloak.kubegit.com/realms/mcp
              scopesSupported:
                - read:all
              bearerMethodsSupported:
                - header
                - body
                - query
        targets:
          - name: qdrant
            mcp:
              host: http://qdrant-mcp-server.mcp-servers.svc.cluster.local:8000/mcp/
            # No backendAuth: the qdrant backend is auth-free internally
            # (NetworkPolicy restricts access to agentgateway-system, kagent,
            # ate-system, traefik). AG is the single auth boundary.
      llm:
#        models:
#          - name: "*"
#            provider: anthropic
#            params:
#              apiKey: "$ANTHROPIC_API_KEY"
          - name: "*"
            provider: openrouter
            params:
              apiKey: "$OPENROUTER_API_KEY"