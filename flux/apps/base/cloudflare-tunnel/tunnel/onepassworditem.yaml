---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-tunnel-token
spec:
  # Materialised as Secret "cloudflare-tunnel-token" with key "token",
  # matching the 1Password item's custom field of the same name. Token
  # comes from Cloudflare Zero Trust -> Networks -> Tunnels -> (tunnel) ->
  # Install connector - it's the remotely-managed tunnel credential, not an
  # API token.
  itemPath: "vaults/wlgvy5jij6zg2sb25nju4nyjnm/items/CLOUDFLARE_TUNNEL_TOKEN"
