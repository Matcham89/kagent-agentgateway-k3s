---
# Official Qdrant MCP server (https://github.com/qdrant/mcp-server-qdrant) —
# a semantic memory layer over the qdrant/qdrant StatefulSet
# (../../qdrant/qdrant/helmrelease.yaml), exposing qdrant-store/qdrant-find
# tools. Qdrant ships no pre-built image for this server (it's a PyPI
# package meant to be run via uvx/pip), so this pip-installs it at
# container start on top of python:3.12-slim rather than maintaining a
# custom-built image.
#
# Trade-off: the pip install (and the fastembed embedding model it pulls on
# first use) re-downloads on every pod restart, since $HOME is an emptyDir.
# Acceptable for a single low-traffic homelab MCP server; revisit with a
# baked image or a persisted cache volume if restarts become frequent.
#
# Lives in the shared `mcp-servers` namespace like slack-mcp/github-mcp —
# not tied to any one consumer; kagent agents connect via a RemoteMCPServer
# (../../kagent/qdrant-mcp/remotemcpserver.yaml). See the NetworkPolicy below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant-mcp-server
  labels:
    app: qdrant-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant-mcp-server
  template:
    metadata:
      labels:
        app: qdrant-mcp-server
    spec:
      containers:
        - name: qdrant-mcp-server
          image: docker.io/library/python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p "$TMPDIR"
              pip install --no-cache-dir --user mcp-server-qdrant==0.8.1
              exec python /opt/qdrant-mcp-entrypoint.py
          env:
            - name: HOME
              value: /home/mcp
            # pip's build tracker needs a writable temp dir; with
            # readOnlyRootFilesystem, /tmp isn't writable by default.
            - name: TMPDIR
              value: /home/mcp/tmp
            - name: QDRANT_URL
              value: "http://qdrant.qdrant.svc.cluster.local:6333"
            - name: COLLECTION_NAME
              value: "content-ideas"
            - name: FASTMCP_SERVER_HOST
              value: "0.0.0.0"
            - name: FASTMCP_SERVER_PORT
              value: "8000"
            # Static Bearer token for headless MCP clients (Hermes researcher
            # gateway). Interactive clients (Claude Desktop) use the OAuth
            # authorization-code flow against the server instead.
            - name: QDRANT_MCP_STATIC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: qdrant-mcp-oauth-token
                  key: token
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true # all writes go to the explicit /home/mcp volume
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: home
              mountPath: /home/mcp
            - name: entrypoint
              mountPath: /opt/qdrant-mcp-entrypoint.py
              subPath: entrypoint.py
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: home
          emptyDir: {}
        - name: entrypoint
          configMap:
            name: qdrant-mcp-oauth-entrypoint
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-mcp-server
  labels:
    app: qdrant-mcp-server
spec:
  selector:
    app: qdrant-mcp-server
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
---
# Shareable by design, same pattern as ../slack-mcp/deployment.yaml — the
# whole `kagent` namespace is allowed (not a single pod label) because tool
# discovery/calls come from kagent-controller (app.kubernetes.io/name=kagent,
# app.kubernetes.io/component=controller) as well as individual agent pods
# (app=kagent), and that split isn't worth tracking label-by-label. Anything
# else opts in with `mcp-client: "true"`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-mcp-server
spec:
  podSelector:
    matchLabels:
      app: qdrant-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
        # AgentHarness sandbox actors (e.g. content-scout) run as substrate
        # worker pool pods in ate-system, not in kagent itself.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
        - namespaceSelector: {} # any namespace
          podSelector:
            matchLabels:
              mcp-client: "true"
        # Traefik (kube-system) forwards external MCP clients (Hermes on the
        # intel box, Claude Code on a laptop) via the IngressRoute above.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
