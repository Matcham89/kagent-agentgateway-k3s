---
# Standalone, always-healthy-by-default nginx target for manual break/fix
# testing. Intentionally wired so a naive `containerPort` edit causes a
# *realistic* silent failure instead of an obvious crash:
#
#   - The container port is named "http" (containerPort: 80).
#   - The readiness/liveness probes target the port BY NAME ("http"), not
#     by number.
#   - The Service also targets the port BY NAME ("http").
#
# containerPort is purely declarative — Kubernetes does not enforce it and
# changing it does NOT change what nginx actually listens on inside the
# container. So if you do:
#
#   kubectl edit deployment nginx-test -n demo
#   # change spec.template.spec.containers[0].ports[0].containerPort
#   # e.g. 80 -> 8080 (leave `name: http` as-is)
#
# ...nginx keeps listening on 80, but the probes (which resolve "http" to
# whatever port now carries that name) start hitting 8080 -> connection
# refused. The pod stays Running (no crash, no restart) but flips to
# NotReady and the Service silently drops its endpoint. This is a very
# common real-world misconfiguration and a good test of whether an
# investigator looks past "pod is Running" to actual readiness/serving
# state.
#
# This also counts as a Deployment rollout (pod template change), so it
# fires ./triggeredhealthcheck.yaml automatically ~30s later.
#
# IMPORTANT — why this Deployment carries an extra `app: nginx-test` label:
# every ks.yaml in this repo sets `commonMetadata.labels:
# {app.kubernetes.io/name: <kustomization-name>}` (see
# flux/apps/dev/demo/nginx-test/ks.yaml), which Kustomize applies to EVERY
# resource's own top-level metadata — including this Deployment's, silently
# overwriting metadata.labels["app.kubernetes.io/name"] to "demo-nginx-test".
# It does NOT touch spec.template.metadata.labels (the pod template), which
# is why the Service (which selects pods, not the Deployment) is unaffected.
# TriggeredHealthCheck's selector matches against the DEPLOYMENT'S OWN
# label, not the pod template's — so if it selected on
# app.kubernetes.io/name it would silently never match (confirmed live: it
# didn't, with no error/log anywhere — purely a silent selector mismatch).
# The `app: nginx-test` label uses a different key that commonMetadata
# never touches, so triggeredhealthcheck.yaml selects on `app` instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  labels:
    app.kubernetes.io/name: nginx-test
    app: nginx-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101 # nginx user in nginx:alpine
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # readOnlyRootFilesystem needs writable dirs for nginx's own
            # runtime files (pid, cache, tmp) — otherwise it fails to start
            # regardless of the port test.
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test
  labels:
    app.kubernetes.io/name: nginx-test
spec:
  selector:
    app.kubernetes.io/name: nginx-test
  ports:
    - name: http
      port: 80
      targetPort: http
